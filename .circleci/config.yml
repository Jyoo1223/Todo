version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Show current directory
          command: pwd
      - run:
          name: List all files recursively
          command: ls -R
      - run:
          name: List app and test files
          command: |
            ls -l app.py todo_logic.py || echo "App files missing"
            ls -l tests/ || echo "Tests folder missing"
      - run:
          name: Check Python version
          command: python --version
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install pytest
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run:
          name: List files in tests folder
          command: ls -l tests/
      - run:
          name: Run tests
          command: python -m pytest tests/

workflows:
  test-workflow:
    jobs:
      - test

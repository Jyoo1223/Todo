version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Show current directory
          command: pwd
      - run:
          name: List files recursively
          command: ls -R
      - run:
          name: List app and test files
          command: |
            ls -l app.py todo_logic.py test_todo.py || echo "Files missing"
      - run:
          name: Check Python version
          command: python --version
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install pytest
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run:
          name: Run tests
          command: python -m pytest test_todo.py

workflows:
  test-workflow:
    jobs:
      - test
